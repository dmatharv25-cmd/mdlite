name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_slow:
        description: "Also run the slow NIST validation tests"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fast tests
        run: python -m pytest -q
      - name: Slow NIST validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_slow }}
        run: python -m pytest -m slow -s -q